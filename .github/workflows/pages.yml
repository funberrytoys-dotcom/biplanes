name: Deploy GitHub Pages

on:
  push:
    branches:
      - feat/hud-animated-panel
  workflow_dispatch:

# Pages "Source" is set to "Deploy from a branch: gh-pages", so we build the
# app and force-push the static output to the gh-pages branch ourselves. This
# avoids the protected `github-pages` environment entirely.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json "packageManager" — do NOT also set a
        # `version` here, or pnpm/action-setup@v4 fails with a version conflict.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to gh-pages branch
        run: |
          cd apps/web/dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
