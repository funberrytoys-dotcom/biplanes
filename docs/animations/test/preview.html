<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bank Cycle Preview — Чико plane</title>
<style>
  body {
    margin: 0;
    background: #0e1116 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="20" height="20" fill="%23161a23"/><rect x="20" y="20" width="20" height="20" fill="%23161a23"/></svg>');
    color: #e6e8ee;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 500; }
  .sub { color: #8a93a6; font-size: 13px; margin-bottom: 32px; }
  .stage {
    width: 600px;
    height: 600px;
    background: linear-gradient(180deg, #2a4a6e 0%, #7a4488 50%, #ff9550 100%);
    border-radius: 12px;
    border: 1px solid #232938;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #plane {
    width: 597px;
    height: 597px;
    background-image: url('plane-player-bank.png');
    background-repeat: no-repeat;
    background-position: 0 0;
    image-rendering: pixelated;
  }
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
  }
  button {
    background: #1f2535;
    color: #e6e8ee;
    border: 1px solid #2a3145;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #2a3245; }
  input[type=range] { width: 200px; }
  .frame-info { color: #8a93a6; font-family: monospace; font-size: 12px; min-width: 80px; }
</style>
</head>
<body>

<h1>Bank Cycle — самолёт Чико</h1>
<p class="sub">16-кадровый loop, сгенерирован из одной канонической картинки через rotation.</p>

<div class="stage">
  <div id="plane"></div>
</div>

<div class="controls">
  <button id="playPause">⏸ Pause</button>
  <label>
    Speed:
    <input type="range" id="speed" min="6" max="30" value="12">
    <span id="speedLabel">12 fps</span>
  </label>
  <span class="frame-info" id="frameInfo">Frame 0 / 16</span>
</div>

<script>
  const FRAMES = 16;
  const COLS = 4;
  const CELL = 597;
  const plane = document.getElementById('plane');
  const playPauseBtn = document.getElementById('playPause');
  const speedSlider = document.getElementById('speed');
  const speedLabel = document.getElementById('speedLabel');
  const frameInfo = document.getElementById('frameInfo');

  let frame = 0;
  let playing = true;
  let fps = 12;
  let lastTime = performance.now();
  let acc = 0;

  function tick(now) {
    const dt = now - lastTime;
    lastTime = now;
    if (playing) {
      acc += dt;
      const frameDuration = 1000 / fps;
      while (acc >= frameDuration) {
        acc -= frameDuration;
        frame = (frame + 1) % FRAMES;
      }
    }
    const col = frame % COLS;
    const row = Math.floor(frame / COLS);
    plane.style.backgroundPosition = `-${col * CELL}px -${row * CELL}px`;
    frameInfo.textContent = `Frame ${frame} / ${FRAMES}`;
    requestAnimationFrame(tick);
  }

  playPauseBtn.addEventListener('click', () => {
    playing = !playing;
    playPauseBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  });
  speedSlider.addEventListener('input', (e) => {
    fps = +e.target.value;
    speedLabel.textContent = `${fps} fps`;
  });

  requestAnimationFrame(tick);
</script>

</body>
</html>
</parameter>
</invoke>
